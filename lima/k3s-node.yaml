# lima/k3s-node.yaml — Phase 1 single-node k3s on Apple Silicon (DISPOSABLE).
# Default flannel CNI is fine here; per ADR-0005 the long-lived cluster is rebuilt
# with Cilium at Phase 2 init. vmnet shared networking is also a Phase 2 concern.
#
#   limactl start --name=trace-lab lima/k3s-node.yaml
vmType: "vz"            # Apple Virtualization.framework (fast, native arm64; macOS 13+)
os: "Linux"
arch: "aarch64"
images:
  # Update the URL/digest to the current 24.04 point release if Lima complains.
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
cpus: 4
memory: "6GiB"          # lean control-plane sizing; fine on a 16GB host
disk: "80GiB"
mounts: []              # no host mounts needed for the MVP
portForwards:
  - guestPort: 6443     # k3s API -> reachable from the host kubeconfig
    hostPort: 6443
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      # Disable Traefik + ServiceLB now to match the locked decisions (ingress-nginx + MetalLB later).
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_EXEC="--disable=traefik --disable=servicelb --write-kubeconfig-mode=644" sh -
probes:
  - description: "k3s kubeconfig present"
    script: |
      #!/bin/bash
      set -eux
      timeout 180s bash -c 'until test -f /etc/rancher/k3s/k3s.yaml; do sleep 3; done'
    hint: "k3s did not come up within 180s; check 'limactl shell trace-lab sudo journalctl -u k3s'."
